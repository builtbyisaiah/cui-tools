name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.deps }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
        deps: [full, minimal]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # harmless once 3.14 is a final release; lets the matrix resolve if it is not yet
          allow-prereleases: true

      - name: Install pypdf (full only)
        if: matrix.deps == 'full'
        run: python -m pip install pypdf

      - name: Compile every tool
        run: python -m py_compile marking_search/marking_search.py

      - name: Run the synthetic end-to-end test
        run: python tests/run_all.py

      - name: Hygiene gate
        run: python tests/hygiene_check.py
